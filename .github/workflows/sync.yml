
name: SportsHub API Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: sportshub-api-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync SportsHub with Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --------------------------------------------------
      # 3. Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # --------------------------------------------------
      # 4. Check Firebase Auto Sync settings
      # --------------------------------------------------
      - name: Check Automatic Sync and Interval
        id: autosync
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");
          const fs = require("fs");

          async function main() {
            try {
              if (
                !process.env.FIREBASE_SERVICE_ACCOUNT ||
                !process.env.FIREBASE_DATABASE_URL
              ) {
                throw new Error("Firebase secrets are missing.");
              }

              admin.initializeApp({
                credential: admin.credential.cert(
                  JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)
                ),
                databaseURL: process.env.FIREBASE_DATABASE_URL
              });

              const snapshot = await admin.database()
                .ref("syncSettings")
                .once("value");

              const settings = snapshot.val() || {};

              const enabled =
                settings.autoSyncEnabled === true;

              let interval = Number(
                settings.syncIntervalMinutes || 15
              );

              if (![5, 15, 30, 60].includes(interval)) {
                console.log(
                  "Invalid interval. Using default 15 minutes."
                );
                interval = 15;
              }

              let shouldSync = false;
              let reason = "";

              if (process.env.EVENT_NAME === "workflow_dispatch") {
                shouldSync = true;
                reason = "Manual sync requested.";
              } else if (
                process.env.EVENT_NAME === "schedule"
              ) {
                if (!enabled) {
                  reason = "Automatic Sync is OFF.";
                } else {
                  const lastSync = Number(
                    settings.lastSuccessfulSync || 0
                  );

                  const elapsed = Date.now() - lastSync;
                  const intervalMs = interval * 60 * 1000;

                  if (lastSync <= 0 || elapsed >= intervalMs) {
                    shouldSync = true;
                    reason = "Selected interval has elapsed.";
                  } else {
                    const remainingSeconds = Math.ceil(
                      (intervalMs - elapsed) / 1000
                    );

                    reason =
                      "Waiting approximately " +
                      Math.floor(remainingSeconds / 60) +
                      " minute(s) and " +
                      (remainingSeconds % 60) +
                      " second(s).";
                  }
                }
              } else {
                reason = "Unsupported workflow event.";
              }

              console.log("Automatic Sync:", enabled);
              console.log("Selected interval:", interval);
              console.log("Event:", process.env.EVENT_NAME);
              console.log("Should sync:", shouldSync);
              console.log("Reason:", reason);

              fs.appendFileSync(
                process.env.GITHUB_OUTPUT,
                [
                  "should_sync=" + shouldSync,
                  "interval=" + interval,
                  "auto_sync_enabled=" + enabled,
                  "reason=" + reason.replace(/[\r\n]/g, " ")
                ].join("\n") + "\n"
              );
            } finally {
              if (admin.apps.length) {
                await Promise.all(
                  admin.apps.map(function (app) {
                    return app.delete();
                  })
                );
              }
            }
          }

          main().catch(function (error) {
            console.error(
              "Automatic sync check failed:",
              error.message
            );
            process.exit(1);
          });
          NODE

      # --------------------------------------------------
      # 5. Select API provider from Firebase
      # --------------------------------------------------
      - name: Select API from Firebase
        id: parser
        if: steps.autosync.outputs.should_sync == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");
          const fs = require("fs");

          async function main() {
            try {
              if (
                !process.env.FIREBASE_SERVICE_ACCOUNT ||
                !process.env.FIREBASE_DATABASE_URL
              ) {
                throw new Error("Firebase secrets are missing.");
              }

              admin.initializeApp({
                credential: admin.credential.cert(
                  JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)
                ),
                databaseURL: process.env.FIREBASE_DATABASE_URL
              });

              const snapshot = await admin.database()
                .ref("settings")
                .once("value");

              const settings = snapshot.val() || {};
              const parserKey = settings.selected_parser || "parse1";

              const parser =
                settings.parse &&
                settings.parse[parserKey];

              if (!parser) {
                throw new Error(
                  "Selected parser not found: " + parserKey
                );
              }

              const apiParser = String(
                parser.api_parser || ""
              ).trim().toLowerCase();

              let provider;

              if (
                apiParser === "365" ||
                apiParser === "365scores"
              ) {
                provider = "365scores";
              } else if (
                apiParser === "api_parser" ||
                apiParser === "apifootball" ||
                apiParser === "api-football" ||
                apiParser === "football"
              ) {
                provider = "api-football";
              } else {
                throw new Error(
                  "Unsupported API parser: " + apiParser
                );
              }

              console.log("Selected parser:", parserKey);
              console.log("API parser value:", apiParser);
              console.log("Selected provider:", provider);

              fs.appendFileSync(
                process.env.GITHUB_OUTPUT,
                "provider=" + provider + "\n"
              );
            } finally {
              if (admin.apps.length) {
                await Promise.all(
                  admin.apps.map(function (app) {
                    return app.delete();
                  })
                );
              }
            }
          }

          main().catch(function (error) {
            console.error(
              "API selection failed:",
              error.message
            );
            process.exit(1);
          });
          NODE

      # --------------------------------------------------
      # 6. Run complete Firebase sync through index.js
      # --------------------------------------------------
      - name: Run SportsHub Sync
        id: run_sync
        if: steps.autosync.outputs.should_sync == 'true'
        env:
          API_PROVIDER: ${{ steps.parser.outputs.provider }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: node index.js

      # --------------------------------------------------
      # 7. Save successful sync timestamp
      # --------------------------------------------------
      - name: Save Successful Sync Time
        if: >-
          success() &&
          steps.autosync.outputs.should_sync == 'true' &&
          steps.run_sync.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
        run: |
          node <<'NODE'
          const admin = require("firebase-admin");

          async function main() {
            try {
              if (
                !process.env.FIREBASE_SERVICE_ACCOUNT ||
                !process.env.FIREBASE_DATABASE_URL
              ) {
                throw new Error("Firebase secrets are missing.");
              }

              admin.initializeApp({
                credential: admin.credential.cert(
                  JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)
                ),
                databaseURL: process.env.FIREBASE_DATABASE_URL
              });

              const now = Date.now();

              await admin.database()
                .ref("syncSettings")
                .update({
                  lastSuccessfulSync: now
                });

              console.log(
                "Successful sync timestamp saved:",
                now
              );
            } finally {
              if (admin.apps.length) {
                await Promise.all(
                  admin.apps.map(function (app) {
                    return app.delete();
                  })
                );
              }
            }
          }

          main().catch(function (error) {
            console.error(
              "Failed to save sync timestamp:",
              error.message
            );
            process.exit(1);
          });
          NODE

      # --------------------------------------------------
      # 8. Workflow summary
      # --------------------------------------------------
      - name: Workflow Summary
        if: always()
        env:
          SHOULD_SYNC: ${{ steps.autosync.outputs.should_sync }}
          SELECTED_INTERVAL: ${{ steps.autosync.outputs.interval }}
          AUTO_SYNC_ENABLED: ${{ steps.autosync.outputs.auto_sync_enabled }}
          SYNC_REASON: ${{ steps.autosync.outputs.reason }}
          SELECTED_PROVIDER: ${{ steps.parser.outputs.provider }}
        run: |
          {
            echo "## SportsHub API Sync"
            echo ""
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Automatic Sync: ${AUTO_SYNC_ENABLED:-unknown}"
            echo "- Should sync: ${SHOULD_SYNC:-unknown}"
            echo "- Selected interval: ${SELECTED_INTERVAL:-unknown} minutes"
            echo "- Provider: ${SELECTED_PROVIDER:-not selected}"
            echo "- Reason: ${SYNC_REASON:-not available}"
            echo "- Job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
