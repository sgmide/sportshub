<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>SportsHub HLS Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: #080a0f;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.player-page {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
    padding: 14px;
}

.header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 2px 16px;
}

.brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.5px;
}

.brand span {
    color: #16d98a;
}

.live-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 6px;
    background: #291115;
    color: #ff5656;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
}

.live-dot {
    width: 7px;
    height: 7px;
    background: #ff3838;
    border-radius: 50%;
    animation: pulse 1.3s infinite;
}

@keyframes pulse {
    50% { opacity: 0.35; }
}

.player-container {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
    border-radius: 12px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.5);
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
    object-fit: contain;
}

.center-play {
    position: absolute;
    z-index: 4;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 66px;
    height: 66px;
    border: none;
    border-radius: 50%;
    background: rgba(22,217,138,0.95);
    color: #07130e;
    font-size: 27px;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
}

.center-play.hidden {
    display: none;
}

.loading {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: none;
    text-align: center;
    font-size: 13px;
    color: #ddd;
}

.spinner {
    width: 42px;
    height: 42px;
    margin: 0 auto 12px;
    border: 4px solid #333;
    border-top-color: #16d98a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.error-box {
    position: absolute;
    z-index: 6;
    top: 50%;
    left: 8%;
    right: 8%;
    transform: translateY(-50%);
    display: none;
    text-align: center;
    padding: 18px;
    background: rgba(20,20,25,0.96);
    border: 1px solid #383838;
    border-radius: 10px;
}

.error-title {
    font-size: 16px;
    font-weight: bold;
    color: #ff6666;
    margin-bottom: 8px;
}

.error-message {
    font-size: 13px;
    color: #ccc;
    line-height: 1.6;
    overflow-wrap: anywhere;
}

.retry-button {
    margin-top: 14px;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    background: #16d98a;
    color: #07130e;
    font-weight: bold;
    cursor: pointer;
}

.controls {
    position: absolute;
    z-index: 3;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 30px 12px 10px;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,0.92)
    );
    transition: opacity 0.25s;
}

.controls.hide-controls {
    opacity: 0;
    pointer-events: none;
}

.progress-area {
    width: 100%;
    height: 16px;
    display: flex;
    align-items: center;
    cursor: pointer;
}

.progress-track {
    width: 100%;
    height: 4px;
    border-radius: 5px;
    background: #555;
    position: relative;
}

.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 5px;
    background: #16d98a;
}

.control-row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 38px;
}

.control-button {
    background: none;
    color: #fff;
    border: none;
    font-size: 19px;
    padding: 4px;
    cursor: pointer;
    min-width: 28px;
}

.control-button:active {
    color: #16d98a;
}

.time-text {
    color: #ddd;
    font-size: 11px;
    white-space: nowrap;
}

.spacer {
    flex: 1;
}

.quality-select {
    max-width: 105px;
    padding: 7px 5px;
    border-radius: 5px;
    border: 1px solid #555;
    color: #fff;
    background: #171717;
    font-size: 12px;
    outline: none;
}

.status-panel {
    padding: 14px 3px;
}

.stream-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 7px;
    overflow-wrap: anywhere;
}

.status-text {
    font-size: 12px;
    color: #a9b1be;
    line-height: 1.6;
}

.status-text.ok {
    color: #16d98a;
}

.status-text.error {
    color: #ff6666;
}

.source-panel {
    margin-top: 12px;
    background: #11151d;
    border: 1px solid #252b36;
    border-radius: 10px;
    padding: 14px;
}

.source-title {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
}

.source-input {
    width: 100%;
    background: #080a0f;
    color: #fff;
    border: 1px solid #343b48;
    border-radius: 6px;
    padding: 12px;
    font-size: 13px;
    outline: none;
}

.source-input:focus {
    border-color: #16d98a;
}

.source-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.action-button {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 11px 8px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.load-button {
    background: #16d98a;
    color: #07130e;
}

.clear-button {
    background: #272d38;
    color: #fff;
}

.footer {
    text-align: center;
    font-size: 11px;
    color: #667080;
    padding: 22px 5px 10px;
}

@media (max-width: 480px) {
    .player-page {
        padding: 8px;
    }

    .header {
        padding: 8px 3px 12px;
    }

    .brand {
        font-size: 19px;
    }

    .player-container {
        border-radius: 7px;
    }

    .control-row {
        gap: 7px;
    }

    .control-button {
        font-size: 17px;
        min-width: 24px;
    }

    .quality-select {
        max-width: 88px;
        font-size: 11px;
    }

    .time-text {
        font-size: 10px;
    }
}

video::-webkit-media-controls {
    display: none !important;
}
</style>
</head>

<body>

<div class="player-page">

    <div class="header">
        <div class="brand">SPORTS<span>HUB</span></div>

        <div class="live-badge">
            <span class="live-dot"></span>
            LIVE
        </div>
    </div>

    <div class="player-container" id="playerContainer">

        <video
            id="video"
            playsinline
            webkit-playsinline
            preload="metadata">
        </video>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <div id="loadingText">Loading stream...</div>
        </div>

        <button
            class="center-play"
            id="centerPlay"
            aria-label="Play">
            ▶
        </button>

        <div class="error-box" id="errorBox">
            <div class="error-title" id="errorTitle">
                Playback Error
            </div>

            <div class="error-message" id="errorMessage">
                Unable to play this stream.
            </div>

            <button
                class="retry-button"
                id="retryButton">
                Retry
            </button>
        </div>

        <div class="controls" id="controls">

            <div
                class="progress-area"
                id="progressArea">

                <div class="progress-track">
                    <div
                        class="progress-fill"
                        id="progressFill">
                    </div>
                </div>
            </div>

            <div class="control-row">

                <button
                    class="control-button"
                    id="playPause"
                    aria-label="Play or pause">
                    ▶
                </button>

                <button
                    class="control-button"
                    id="muteButton"
                    aria-label="Mute">
                    🔊
                </button>

                <span
                    class="time-text"
                    id="timeText">
                    LIVE
                </span>

                <div class="spacer"></div>

                <select
                    class="quality-select"
                    id="qualitySelect"
                    aria-label="Video quality">

                    <option value="-1">Auto Quality</option>
                </select>

                <button
                    class="control-button"
                    id="fullscreenButton"
                    aria-label="Fullscreen">
                    ⛶
                </button>

            </div>
        </div>
    </div>

    <div class="status-panel">

        <div class="stream-title" id="streamTitle">
            Sports Live Stream
        </div>

        <div
            class="status-text"
            id="statusText">
            Enter an HLS stream URL to begin.
        </div>

    </div>

    <div class="source-panel">

        <div class="source-title">
            HLS Stream URL
        </div>

        <input
            class="source-input"
            id="sourceInput"
            type="url"
            placeholder="https://example.com/live/stream.m3u8"
            autocomplete="off"
            spellcheck="false">

        <div class="source-actions">

            <button
                class="action-button load-button"
                id="loadButton">
                Load Stream
            </button>

            <button
                class="action-button clear-button"
                id="clearButton">
                Clear
            </button>

        </div>
    </div>

    <div class="footer">
        SportsHub HLS Player
    </div>

</div>

<script>
(function () {
    "use strict";

    var video = document.getElementById("video");
    var playerContainer =
        document.getElementById("playerContainer");

    var controls = document.getElementById("controls");
    var playPause = document.getElementById("playPause");
    var centerPlay = document.getElementById("centerPlay");
    var muteButton = document.getElementById("muteButton");
    var fullscreenButton =
        document.getElementById("fullscreenButton");

    var qualitySelect =
        document.getElementById("qualitySelect");

    var sourceInput =
        document.getElementById("sourceInput");

    var loadButton =
        document.getElementById("loadButton");

    var clearButton =
        document.getElementById("clearButton");

    var retryButton =
        document.getElementById("retryButton");

    var loading = document.getElementById("loading");
    var loadingText =
        document.getElementById("loadingText");

    var errorBox = document.getElementById("errorBox");
    var errorTitle = document.getElementById("errorTitle");
    var errorMessage =
        document.getElementById("errorMessage");

    var statusText =
        document.getElementById("statusText");

    var streamTitle =
        document.getElementById("streamTitle");

    var timeText = document.getElementById("timeText");
    var progressArea =
        document.getElementById("progressArea");

    var progressFill =
        document.getElementById("progressFill");

    var hls = null;
    var currentUrl = "";
    var lastError = "";
    var controlsTimer = null;
    var fatalRecoveryAttempted = false;

    function setStatus(message, type) {
        statusText.textContent = message;
        statusText.className = "status-text";

        if (type) {
            statusText.classList.add(type);
        }
    }

    function showLoading(message) {
        loadingText.textContent =
            message || "Loading stream...";

        loading.style.display = "block";
    }

    function hideLoading() {
        loading.style.display = "none";
    }

    function showError(title, message) {
        hideLoading();

        errorTitle.textContent = title;
        errorMessage.textContent = message;

        errorBox.style.display = "block";
        centerPlay.classList.add("hidden");

        setStatus(message, "error");
    }

    function hideError() {
        errorBox.style.display = "none";
    }

    function destroyHls() {
        if (hls) {
            try {
                hls.destroy();
            } catch (e) {
                // Ignore cleanup errors.
            }

            hls = null;
        }
    }

    function clearQualityOptions() {
        qualitySelect.innerHTML = "";

        var option = document.createElement("option");
        option.value = "-1";
        option.textContent = "Auto Quality";

        qualitySelect.appendChild(option);
    }

    function setQualityOptions(levels) {
        clearQualityOptions();

        if (!levels || levels.length === 0) {
            qualitySelect.disabled = true;
            return;
        }

        qualitySelect.disabled = false;

        var seen = {};

        for (var i = 0; i < levels.length; i++) {
            var level = levels[i];
            var height = level.height || 0;
            var bitrate = level.bitrate || 0;

            var label;

            if (height > 0) {
                label = height + "p";
            } else if (bitrate > 0) {
                label = Math.round(bitrate / 1000) + " kbps";
            } else {
                label = "Level " + (i + 1);
            }

            if (seen[label]) {
                label += " (" + (i + 1) + ")";
            }

            seen[label] = true;

            var option = document.createElement("option");
            option.value = String(i);
            option.textContent = label;

            qualitySelect.appendChild(option);
        }

        qualitySelect.value = "-1";
    }

    function resetPlayer() {
        destroyHls();

        try {
            video.pause();
            video.removeAttribute("src");
            video.load();
        } catch (e) {
            // Ignore reset errors.
        }

        hideLoading();
        hideError();

        centerPlay.classList.remove("hidden");
        playPause.textContent = "▶";

        progressFill.style.width = "0%";
        timeText.textContent = "LIVE";

        fatalRecoveryAttempted = false;

        clearQualityOptions();
        qualitySelect.disabled = true;
    }

    function loadStream(url) {
        if (!url) {
            showError(
                "Missing Stream URL",
                "Enter a valid .m3u8 URL."
            );
            return;
        }

        if (!/^https?:\/\//i.test(url)) {
            showError(
                "Invalid URL",
                "The stream URL must start with http:// or https://."
            );
            return;
        }

        currentUrl = url;
        sourceInput.value = url;

        streamTitle.textContent = "Sports Live Stream";

        resetPlayer();
        showLoading("Connecting to stream...");

        setStatus("Connecting to stream...", "");

        if (window.Hls && Hls.isSupported()) {
            loadWithHlsJs(url);
        } else if (
            video.canPlayType("application/vnd.apple.mpegurl")
        ) {
            loadNativeHls(url);
        } else {
            showError(
                "HLS Not Supported",
                "This browser does not support HLS playback."
            );
        }
    }

    function loadWithHlsJs(url) {
        hls = new Hls({
            enableWorker: true,
            capLevelToPlayerSize: true,
            startLevel: -1,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            manifestLoadingTimeOut: 20000,
            manifestLoadingMaxRetry: 2,
            levelLoadingTimeOut: 20000,
            fragLoadingTimeOut: 30000
        });

        hls.on(Hls.Events.MEDIA_ATTACHED, function () {
            hls.loadSource(url);
        });

        hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
            hideLoading();
            hideError();

            setQualityOptions(data.levels);

            setStatus(
                "Stream ready. Select quality or press Play.",
                "ok"
            );

            /*
             * Playback normally requires a user gesture.
             * Do not force autoplay.
             */
            centerPlay.classList.remove("hidden");
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
            var level = hls.levels[data.level];

            if (level && level.height) {
                setStatus(
                    "Playing at " + level.height + "p",
                    "ok"
                );
            }
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
            if (!data.fatal) {
                return;
            }

            if (fatalRecoveryAttempted) {
                showError(
                    "Playback Failed",
                    "The stream could not recover. Check the URL or try again."
                );
                return;
            }

            fatalRecoveryAttempted = true;

            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                showLoading("Retrying network connection...");

                setStatus(
                    "Network error. Attempting recovery...",
                    ""
                );

                hls.startLoad();

            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                showLoading("Recovering media...");

                setStatus(
                    "Media error. Attempting recovery...",
                    ""
                );

                hls.recoverMediaError();

            } else {
                showError(
                    "Fatal Stream Error",
                    data.details || "Unable to play this stream."
                );

                destroyHls();
            }
        });

        hls.attachMedia(video);
    }

    function loadNativeHls(url) {
        video.addEventListener("error", onNativeVideoError);

        video.src = url;
        video.load();

        setStatus(
            "Native HLS playback selected.",
            "ok"
        );
    }

    function onNativeVideoError() {
        if (!currentUrl) {
            return;
        }

        var message = "Unable to play this stream.";

        if (video.error) {
            switch (video.error.code) {
                case 2:
                    message = "Network error while loading stream.";
                    break;

                case 3:
                    message = "Stream decoding failed.";
                    break;

                case 4:
                    message = "Stream format or URL is unsupported.";
                    break;
            }
        }

        showError("Playback Error", message);
    }

    function togglePlayback() {
        if (!currentUrl) {
            showError(
                "No Stream Loaded",
                "Enter a stream URL and tap Load Stream."
            );
            return;
        }

        if (video.paused) {
            var promise = video.play();

            if (promise && promise.catch) {
                promise.catch(function () {
                    setStatus(
                        "Playback blocked. Tap Play again or check the stream.",
                        "error"
                    );
                });
            }
        } else {
            video.pause();
        }
    }

    video.addEventListener("play", function () {
        playPause.textContent = "❚❚";
        centerPlay.classList.add("hidden");

        hideError();
        hideLoading();

        setStatus("Playing", "ok");
    });

    video.addEventListener("pause", function () {
        playPause.textContent = "▶";

        if (currentUrl) {
            centerPlay.classList.remove("hidden");
        }
    });

    video.addEventListener("waiting", function () {
        if (!video.paused) {
            showLoading("Buffering...");
        }
    });

    video.addEventListener("playing", function () {
        hideLoading();
        hideError();
    });

    video.addEventListener("canplay", function () {
        hideLoading();
    });

    video.addEventListener("timeupdate", function () {
        /*
         * For live streams, seekable ranges may not begin at zero.
         */
        if (
            video.seekable &&
            video.seekable.length > 0 &&
            isFinite(video.duration)
        ) {
            var duration = video.duration;
            var current = video.currentTime;

            if (duration > 0) {
                progressFill.style.width =
                    Math.min(100, current / duration * 100) + "%";
            }
        }

        if (
            video.seekable &&
            video.seekable.length > 0 &&
            !isFinite(video.duration)
        ) {
            var end =
                video.seekable.end(video.seekable.length - 1);

            var start =
                video.seekable.start(video.seekable.length - 1);

            if (end > start) {
                var currentTime = video.currentTime;

                var percent =
                    (currentTime - start) / (end - start) * 100;

                progressFill.style.width =
                    Math.max(0, Math.min(100, percent)) + "%";
            }
        }

        if (video.duration && isFinite(video.duration)) {
            timeText.textContent =
                formatTime(video.currentTime) +
                " / " +
                formatTime(video.duration);
        } else {
            timeText.textContent = "LIVE";
        }
    });

    function formatTime(seconds) {
        if (!isFinite(seconds) || seconds < 0) {
            return "00:00";
        }

        var minutes = Math.floor(seconds / 60);
        var remainingSeconds = Math.floor(seconds % 60);

        return (
            (minutes < 10 ? "0" : "") + minutes +
            ":" +
            (remainingSeconds < 10 ? "0" : "") +
            remainingSeconds
        );
    }

    playPause.addEventListener("click", togglePlayback);
    centerPlay.addEventListener("click", togglePlayback);

    muteButton.addEventListener("click", function () {
        video.muted = !video.muted;

        muteButton.textContent =
            video.muted ? "🔇" : "🔊";
    });

    qualitySelect.addEventListener("change", function () {
        if (!hls) {
            return;
        }

        var selected = parseInt(
            qualitySelect.value,
            10
        );

        if (isNaN(selected) || selected < 0) {
            hls.currentLevel = -1;

            setStatus("Quality: Auto", "ok");
        } else {
            hls.currentLevel = selected;

            var level = hls.levels[selected];

            setStatus(
                "Quality selected: " +
                (level.height ? level.height + "p" : "Level " + (selected + 1)),
                "ok"
            );
        }
    });

    function toggleFullscreen() {
        if (document.fullscreenElement) {
            document.exitFullscreen();
            return;
        }

        if (playerContainer.requestFullscreen) {
            playerContainer.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
        } else if (playerContainer.webkitRequestFullscreen) {
            playerContainer.webkitRequestFullscreen();
        } else {
            setStatus(
                "Fullscreen is not supported in this browser.",
                "error"
            );
        }
    }

    fullscreenButton.addEventListener(
        "click",
        toggleFullscreen
    );

    function seekToClick(event) {
        if (!video.seekable || video.seekable.length === 0) {
            return;
        }

        var rect = progressArea.getBoundingClientRect();

        var percent =
            (event.clientX - rect.left) / rect.width;

        percent = Math.max(0, Math.min(1, percent));

        try {
            var end =
                video.seekable.end(video.seekable.length - 1);

            var start =
                video.seekable.start(video.seekable.length - 1);

            video.currentTime =
                start + (end - start) * percent;

        } catch (e) {
            // Some live streams do not allow seeking.
        }
    }

    progressArea.addEventListener(
        "click",
        seekToClick
    );

    loadButton.addEventListener("click", function () {
        loadStream(sourceInput.value.trim());
    });

    sourceInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
            loadStream(sourceInput.value.trim());
        }
    });

    clearButton.addEventListener("click", function () {
        currentUrl = "";

        resetPlayer();

        sourceInput.value = "";

        setStatus(
            "Enter an HLS stream URL to begin.",
            ""
        );

        streamTitle.textContent = "Sports Live Stream";
    });

    retryButton.addEventListener("click", function () {
        if (currentUrl) {
            loadStream(currentUrl);
        }
    });

    /*
     * Hide controls after inactivity while the video is playing.
     */
    function showControlsTemporarily() {
        controls.classList.remove("hide-controls");

        if (controlsTimer) {
            clearTimeout(controlsTimer);
        }

        if (!video.paused) {
            controlsTimer = setTimeout(function () {
                controls.classList.add("hide-controls");
            }, 3500);
        }
    }

    playerContainer.addEventListener(
        "mousemove",
        showControlsTemporarily
    );

    playerContainer.addEventListener(
        "touchstart",
        showControlsTemporarily
    );

    video.addEventListener("pause", function () {
        controls.classList.remove("hide-controls");
    });

    /*
     * Read the stream URL from:
     * hls6.html?src=https%3A%2F%2Fexample.com%2Flive.m3u8
     *
     * Also supports ?url=...
     */
    function getStreamFromQuery() {
        var params = new URLSearchParams(
            window.location.search
        );

        return (
            params.get("src") ||
            params.get("url") ||
            ""
        ).trim();
    }

    var initialUrl = getStreamFromQuery();

    if (initialUrl) {
        sourceInput.value = initialUrl;
        loadStream(initialUrl);
    } else {
        clearQualityOptions();
        qualitySelect.disabled = true;
    }

})();
</script>

</body>
</html>
